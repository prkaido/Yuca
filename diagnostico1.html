<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrodiagnóstico</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f5f2;
  margin:0;
  padding:20px;
}

.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  margin:10px 0;
}

.btn{
  background:#1f7a3d;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

.hidden{
  display:none;
}

.progress{
  height:10px;
  background:#ddd;
  border-radius:999px;
  overflow:hidden;
  margin:12px 0;
}

.bar{
  height:10px;
  background:#1f7a3d;
  width:0%;
  transition:width .3s ease;
}

.q{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.opts{
  margin-top:8px;
}

.opts button{
  margin:2px;
  padding:8px 12px;
  border:1px solid #999;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}

.active{
  background:#1f7a3d !important;
  color:#fff;
}
</style>
<link rel="stylesheet" href="/diagnostico.css">
</head>

<body>

<div class="card">

<!-- INICIO -->
<div id="start">
  <h1>🌱 Diagnóstico Agroproductivo de la Yuca</h1>

  <p>Ingrese su nombre para iniciar</p>

  <input id="persona" placeholder="Nombre del productor">

  <p id="startMsg" class="message"></p>

  <button type="button" class="btn" onclick="startSurvey()">
    Iniciar
  </button>
</div>

<!-- ENCUESTA -->
<div id="survey" class="hidden">

  <h1>🌱 Enunciados</h1>

  <div class="legend">
    <span>1 Nunca</span>
    <span>2 Rara vez</span>
    <span>3 A veces</span>
    <span>4 Frecuentemente</span>
    <span>5 Siempre</span>
  </div>

  <div class="progress" role="progressbar" aria-label="Progreso del diagnostico" aria-valuemin="0" aria-valuemax="100">
    <div id="bar" class="bar"></div>
  </div>

  <p id="meta"></p>

  <div id="questions"></div>

  <p id="msg"></p>

  <div class="form-actions">

    <button type="button" id="prevBtn" class="btn" onclick="prevBlock()">
      Anterior
    </button>

    <button type="button" id="nextBtn" class="btn" onclick="nextBlock()">
      Siguiente
    </button>

    <button type="button" id="sendBtn" class="btn hidden" onclick="submitData()">
      Enviar
    </button>

  </div>

</div>

</div>

<script src="/diagnostico.js"></script>
<script>

const SCRIPT_URL = "/api/diagnosticos";

let idEnvio = window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;

const questions = [

"¿Evalúa la rentabilidad esperada del cultivo antes de iniciar cada ciclo?",
"¿Define metas de producción antes de iniciar cada ciclo?",
"¿Establece metas de ingresos o ganancias esperadas por ciclo?",
"¿Evalúa si cuenta con suficiente capital para iniciar el cultivo?",
"¿Consulta precios del mercado antes de sembrar?",
"¿Define quiénes participarán en las labores del cultivo?",
"¿Tiene claro a quién venderá la cosecha antes de sembrar?",
"¿Identifica los principales problemas productivos antes de comenzar?",
"¿Trabaja coordinadamente con otros productores o asociaciones?",
"¿Reconoce fortalezas y debilidades de su unidad productiva?",
"¿Elabora un presupuesto total antes de iniciar la siembra?",
"¿Calcula los costos de mano de obra y jornales?",
"¿Calcula los costos de insumos, fertilizantes y transporte?",
"¿Organiza las actividades del cultivo en un cronograma de trabajo?",
"¿Define las fechas de preparación, siembra y cosecha con anticipación?",
"¿Planifica cuántas personas necesita en cada etapa del cultivo?",
"¿Define metas de productividad por hectárea antes de sembrar?",
"¿Gestiona crédito o financiamiento formal para su cultivo?",
"¿Adquiere insumos con anticipación para evitar sobrecostos?",
"¿Evalúa riesgos climáticos antes de iniciar la siembra?",
"¿Evalúa riesgos fitosanitarios (plagas y enfermedades) antes de sembrar?",
"¿Cuenta con un plan alternativo si la cosecha falla o los precios bajan?",
"¿Planifica el uso eficiente del agua durante el ciclo productivo?",
"¿Planifica el uso de maquinaria o herramientas por etapa del cultivo?",
"(*) ¿Siembra sin consultar previamente los precios del mercado?",
"¿Cumple el cronograma de actividades planificado durante el cultivo?",
"¿Registra los gastos y pagos realizados durante el cultivo?",
"¿Usa una herramienta (cuaderno, app o Excel) para llevar sus cuentas?",
"¿Supervisa el desempeño de los trabajadores o jornaleros?",
"¿Consulta información técnica o de precios usando su celular u otros medios?",
"¿Mantiene comunicación activa con compradores potenciales durante el cultivo?",
"¿Busca asistencia técnica cuando surge un problema productivo?",
"¿Ajusta sus actividades cuando cambian las condiciones del entorno?",
"¿Reduce desperdicios de insumos y materiales durante la ejecución?",
"¿Verifica la calidad de los insumos antes de aplicarlos al cultivo?",
"(*) ¿Realiza gastos sin llevar ningún tipo de registro?",
"¿Lleva un control periódico del avance del cultivo?",
"¿Compara regularmente lo ejecutado con lo planificado?",
"¿Mide los costos reales acumulados durante el ciclo?",
"¿Detecta desviaciones del presupuesto a tiempo para corregirlas?",
"¿Mide el rendimiento del cultivo por hectárea?",
"¿Controla las pérdidas ocasionadas por plagas o condiciones climáticas?",
"¿Corrige los problemas del cultivo de forma oportuna cuando aparecen?",
"¿Monitorea la calidad del producto durante su desarrollo?",
"¿Controla el flujo de caja durante el ciclo productivo?",
"¿Compara los resultados actuales con los de ciclos anteriores?",
"¿Toma decisiones basadas en indicadores o registros del cultivo?",
"¿Documenta las incidencias o problemas ocurridos durante el cultivo?",
"(*) ¿Toma decisiones sobre el cultivo sin revisar los resultados anteriores?",
"¿Planifica la cosecha con suficiente anticipación?",
"¿Coordina el transporte de la cosecha con anticipación para evitar pérdidas?",
"¿Negocia precios con diferentes compradores antes de vender?",
"¿Busca alternativas de venta directa sin intermediarios?",
"¿Calcula la utilidad o pérdida total al finalizar el ciclo?",
"¿Ahorra parte de las ganancias para financiar el siguiente ciclo?",
"¿Evalúa el cumplimiento de las metas establecidas al inicio?",
"¿Analiza los errores cometidos durante el proceso para no repetirlos?",
"¿Conserva registros del ciclo para apoyar decisiones futuras?",
"¿Comparte los aprendizajes del ciclo con otros productores o asociados?",
"(*) ¿Termina el ciclo sin evaluar si cumplió sus metas iniciales?",
"¿Aplica prácticas agrícolas amigables con el medio ambiente?",
"¿Reutiliza residuos agrícolas (hojas, tallos, etc.) en el proceso productivo?",
"¿Ha probado nuevas variedades de yuca para mejorar el rendimiento?",
"¿Participa en capacitaciones o talleres técnicos del sector?",
"¿Experimenta con nuevas prácticas o métodos para mejorar su cultivo?"

];

let idx = 0;
let answers = {};

function startSurvey(){

  const n = document.getElementById('persona').value.trim();

  if(!n){
    alert('Ingrese el nombre');
    return;
  }

  document.getElementById('start').classList.add('hidden');
  document.getElementById('survey').classList.remove('hidden');

  render();
}

function render(){

  // BARRA
  const progress =
    (Object.keys(answers).length / questions.length) * 100;

  document.getElementById('bar').style.width = progress + '%';

  // META
  const totalBlocks = Math.ceil(questions.length / 10);
  const currentBlock = Math.floor(idx / 10) + 1;

  document.getElementById('meta').innerText =
    `Bloque ${currentBlock} de ${totalBlocks}`;

  // BOTONES
  const isLastBlock = (idx + 10) >= questions.length;

  document.getElementById('nextBtn')
    .classList.toggle('hidden', isLastBlock);

  document.getElementById('sendBtn')
    .classList.toggle('hidden', !isLastBlock);

  // PREGUNTAS
  let html = '';

  for(let i = idx; i < Math.min(idx + 10, questions.length); i++){

    html += `
      <div class="q">

        <div>${i + 1}. ${questions[i]}</div>

        <div class="opts">
    `;

    for(let v = 1; v <= 5; v++){

      const active = answers[i] === v ? 'active' : '';

      html += `
        <button
          type="button"
          class="${active}"
          onclick="setAns(${i}, ${v})"
        >
          ${v}
        </button>
      `;
    }

    html += `
        </div>
      </div>
    `;
  }

  document.getElementById('questions').innerHTML = html;
}

function setAns(i, v){

  answers[i] = v;

  render();
}

function nextBlock(){

  if(idx + 10 < questions.length){
    idx += 10;
  }

  render();
}

function prevBlock(){

  if(idx - 10 >= 0){
    idx -= 10;
  }

  render();
}

async function submitData(){

  const msg = document.getElementById("msg");
  const btn = document.getElementById("sendBtn");

  btn.disabled = true;
  btn.innerText = "Enviando...";

  try{

    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        idEnvio: idEnvio,
        tipo: "diagnostico1",
        nombre: document.getElementById("persona").value,
        respuestas: answers
      }),
      headers: {
        "Content-Type": "application/json"
      }
    });

    const text = await res.text();
    const json = JSON.parse(text);

    if(json.ok){

      document.querySelector(".card").innerHTML = `
        <div style="text-align:center;padding:40px">
          <h1 style="color:#1f7a3d">✅ Éxito</h1>
          <p>Formulario enviado correctamente</p>
        </div>
      `;

    }else{

      msg.innerHTML =
        "❌ Error del servidor: " +
        (json.error || "desconocido");
    }

  }catch(e){

    console.error(e);

    msg.innerHTML =
      "Error de conexion con el servidor local";
  }
}

const BLOCK_SIZE = 10;
const ui = DiagnosticUI;
const elements = {
  card: document.querySelector(".card"),
  start: document.getElementById("start"),
  survey: document.getElementById("survey"),
  persona: document.getElementById("persona"),
  startMsg: document.getElementById("startMsg"),
  bar: document.getElementById("bar"),
  meta: document.getElementById("meta"),
  questions: document.getElementById("questions"),
  msg: document.getElementById("msg"),
  prevBtn: document.getElementById("prevBtn"),
  nextBtn: document.getElementById("nextBtn"),
  sendBtn: document.getElementById("sendBtn"),
  startBtn: document.querySelector("#start .btn")
};

document.querySelector("#start h1").textContent = "Diagnostico Agroproductivo de la Yuca";
document.querySelector("#survey h1").textContent = "Enunciados";
ui.bindEnterToStart(elements.persona, elements.startBtn);

function startSurvey(){
  const name = elements.persona.value.trim();

  if(!name){
    elements.persona.focus();
    ui.setMessage(elements.startMsg, "warn", "Ingrese el nombre del productor para iniciar.");
    return;
  }

  ui.clearMessage(elements.startMsg);
  ui.clearMessage(elements.msg);
  elements.start.classList.add("hidden");
  elements.survey.classList.remove("hidden");
  render();
}

function render(){
  const total = questions.length;
  const totalBlocks = Math.ceil(total / BLOCK_SIZE);
  const currentBlock = Math.floor(idx / BLOCK_SIZE) + 1;
  const bounds = ui.blockBounds(idx, total, BLOCK_SIZE);
  const isLastBlock = bounds.end >= total;

  ui.setProgress(elements.bar, answers, total);
  elements.meta.textContent =
    `Bloque ${currentBlock} de ${totalBlocks} - ${ui.answerCount(answers)} de ${total} respondidas`;

  elements.prevBtn.disabled = idx === 0;
  elements.nextBtn.classList.toggle("hidden", isLastBlock);
  elements.sendBtn.classList.toggle("hidden", !isLastBlock);

  let html = "";

  for(let i = bounds.start; i < bounds.end; i += 1){
    html += `
      <div class="q">
        <div class="question-title">
          <span class="question-number">${i + 1}</span>
          <span>${ui.escapeHtml(questions[i])}</span>
        </div>
        <div class="opts scale">
    `;

    for(let v = 1; v <= 5; v += 1){
      const active = answers[i] === v ? "active" : "";

      html += `
        <button
          type="button"
          class="${active}"
          aria-pressed="${answers[i] === v}"
          onclick="setAns(${i}, ${v})"
        >${v}</button>
      `;
    }

    html += `
        </div>
      </div>
    `;
  }

  elements.questions.innerHTML = html;
}

function setAns(i, v){
  answers[i] = v;
  ui.clearMessage(elements.msg);
  render();
}

function nextBlock(){
  if(!validateCurrentBlock()){
    return;
  }

  if(idx + BLOCK_SIZE < questions.length){
    idx += BLOCK_SIZE;
  }

  render();
}

function prevBlock(){
  if(idx - BLOCK_SIZE >= 0){
    idx -= BLOCK_SIZE;
  }

  ui.clearMessage(elements.msg);
  render();
}

async function submitData(){
  const missing = ui.missingIndexes(answers, 0, questions.length);

  if(missing.length > 0){
    idx = Math.floor(missing[0] / BLOCK_SIZE) * BLOCK_SIZE;
    render();
    ui.setMessage(elements.msg, "warn", `Faltan ${missing.length} preguntas por responder.`);
    return;
  }

  ui.setBusy(elements.sendBtn, true, "Enviando...");
  ui.clearMessage(elements.msg);

  try{
    await ui.postJSON(SCRIPT_URL, {
      idEnvio: idEnvio,
      tipo: "diagnostico1",
      nombre: elements.persona.value.trim(),
      respuestas: answers
    });

    ui.showSuccess(elements.card);
  }catch(e){
    console.error(e);
    ui.setBusy(elements.sendBtn, false, "Enviando...");
    ui.setMessage(elements.msg, "error", e.message || "Error de conexion con el servidor local.");
  }
}

function validateCurrentBlock(){
  const bounds = ui.blockBounds(idx, questions.length, BLOCK_SIZE);
  const missing = ui.missingIndexes(answers, bounds.start, bounds.end);

  if(missing.length > 0){
    ui.setMessage(elements.msg, "warn", `Faltan ${missing.length} preguntas en este bloque.`);
    return false;
  }

  ui.clearMessage(elements.msg);
  return true;
}

</script>

</body>
</html>
