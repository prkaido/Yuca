<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Yuca 4.0</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f3;
      --ink: #172018;
      --muted: #5d685d;
      --line: #dfe6dc;
      --green: #1f7a3d;
      --green-dark: #14572c;
      --yellow: #f0c44c;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .dot.ok {
      background: var(--green);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }

    a,
    button {
      font: inherit;
    }

    .action {
      display: flex;
      min-height: 86px;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }

    .action strong {
      font-size: 17px;
    }

    .action span {
      color: var(--muted);
      font-size: 14px;
    }

    .action.primary {
      border-color: var(--green);
      background: var(--green);
      color: var(--white);
    }

    .action.primary span {
      color: rgba(255, 255, 255, 0.82);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .stat b {
      display: block;
      font-size: 34px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    section {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
    }

    .link {
      border: 0;
      background: transparent;
      color: var(--green-dark);
      cursor: pointer;
      text-decoration: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 12px 10px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .empty {
      padding: 22px 0 4px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .actions,
      .stats {
        grid-template-columns: 1fr;
      }

      th:nth-child(1),
      td:nth-child(1),
      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Server Yuca 4.0</h1>
      </div>
      <div class="status" id="status"><span class="dot"></span><span>Verificando servidor</span></div>
    </header>

    <div class="actions">
      <a class="action primary" href="/diagnostico1.html">
        <strong>Diagnostico 1</strong>
        <span>Formulario escala 1 a 5</span>
      </a>
      <a class="action" href="/diagnostico2.html">
        <strong>Diagnostico 2</strong>
        <span>Formulario de opciones</span>
      </a>
      <a class="action" href="/api/diagnosticos.csv">
        <strong>Descargar CSV</strong>
        <span>Exportar envios</span>
      </a>
    </div>

    <div class="stats">
      <div class="stat">
        <b id="total">0</b>
        <span>Total de envios</span>
      </div>
      <div class="stat">
        <b id="diag1">0</b>
        <span>Diagnostico 1</span>
      </div>
      <div class="stat">
        <b id="diag2">0</b>
        <span>Diagnostico 2</span>
      </div>
    </div>

    <section>
      <div class="section-title">
        <h2>Envios recientes</h2>
        <button class="link" type="button" id="refresh">Actualizar</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Preguntas</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">Sin envios guardados todavia.</div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");
    const emptyEl = document.getElementById("empty");

    document.getElementById("refresh").addEventListener("click", loadDashboard);
    loadDashboard();

    async function loadDashboard() {
      try {
        const [healthRes, resumenRes, diagnosticosRes] = await Promise.all([
          fetch("/api/health"),
          fetch("/api/resumen"),
          fetch("/api/diagnosticos?limit=20")
        ]);

        const health = await healthRes.json();
        const resumen = await resumenRes.json();
        const diagnosticos = await diagnosticosRes.json();

        if (!health.ok || !resumen.ok || !diagnosticos.ok) {
          throw new Error("Respuesta inesperada");
        }

        statusEl.innerHTML = '<span class="dot ok"></span><span>Servidor activo</span>';
        document.getElementById("total").textContent = resumen.total;
        document.getElementById("diag1").textContent = resumen.diagnostico1;
        document.getElementById("diag2").textContent = resumen.diagnostico2;
        renderRows(diagnosticos.data);
      } catch (error) {
        console.error(error);
        statusEl.innerHTML = '<span class="dot"></span><span>Sin conexion</span>';
      }
    }

    function renderRows(rows) {
      rowsEl.innerHTML = "";
      emptyEl.hidden = rows.length > 0;

      for (const row of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(row.id)}</td>
          <td>${escapeHtml(row.nombre)}</td>
          <td>${escapeHtml(row.tipo)}</td>
          <td>${escapeHtml(row.totalPreguntas)}</td>
          <td>${escapeHtml(row.createdAt)}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
