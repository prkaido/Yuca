services:
  - type: web
    name: server-yuca-4
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NGROK_ENABLED
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: server-yuca-4-db
          property: connectionString

databases:
  - name: server-yuca-4-db
    plan: free
    databaseName: server_yuca_4
    user: server_yuca_4
